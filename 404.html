<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found — Ahmed Elngar</title>
    <meta name="robots" content="noindex, follow" />
    <link rel="canonical" href="https://ahmed-a-elngar.github.io/" />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="assets/favicon-32.png" sizes="32x32" type="image/png" />
    <meta name="theme-color" content="#2772db" />
    <script>
      (function () {
        try {
          document.documentElement.setAttribute(
            "data-theme",
            localStorage.getItem("theme") === "light" ? "light" : "dark",
          );
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="assets/themes/midnight/theme.css" />
    <style>
      .nf {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 2rem;
        gap: 0.4rem;
      }
      .nf-code {
        font-family: "Syne", sans-serif;
        font-size: clamp(4rem, 18vw, 9rem);
        font-weight: 800;
        line-height: 1;
        background: linear-gradient(135deg, var(--accent), var(--accent2));
        background-clip: text;
        -webkit-background-clip: text;
        color: transparent;
      }
      .nf h1 {
        font-family: "Syne", sans-serif;
        font-size: 1.5rem;
        color: var(--text);
        margin-top: 0.5rem;
      }
      .nf p {
        color: var(--muted);
        font-size: 14px;
        max-width: 420px;
        margin: 0.6rem 0 1.6rem;
        line-height: 1.7;
      }
    </style>
  </head>
  <body>
    <div class="grain"></div>
    <main class="nf">
      <div class="nf-code">404</div>
      <h1>This page doesn't exist</h1>
      <p>
        The link may be broken or the page may have moved. Everything lives on
        the main portfolio page.
      </p>
      <a href="/" class="btn-primary">← Back to portfolio</a>
    </main>
  </body>
</html>
